<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>NEHAN // ALPHA</title>
<link rel="stylesheet" href="style.css?v=0.7">
<link rel="preload" as="image" href="assets/studio_logo.png">
<link rel="preload" as="image" href="assets/home-city.webp">

</head>
<body>
<div id="app"></div>
<div id="splash" class="splash" role="button" tabindex="0" aria-label="スタジオロゴ・タップでスキップ">
  <img src="assets/studio_logo.png" alt="STUDIO" width="1122" height="1402">
  <span>TAP TO CONNECT</span>
</div>
<script>
(() => {
"use strict";

const ALPHA = {
  weaponEndsTurn: true, // TODO(要確認): 正式仕様では未確定。α版では通常攻撃=標準実行として隔離。
  breakIncreaseMax: 0.5,
  maxSlots: 3
};

const MEMORIES = [
  {
    id:"M001", name:"破砕", category:"攻撃", rarity:"コモン", ct:2, execution:"STANDARD",
    basePower:16, main:"STR", hit:65,
    formula:"16 × (1 + √STR × 0.12)",
    description:"敵に高威力ダメージ。STRのみで威力計算。命中率は低い。"
  },
  {
    id:"M002", name:"速断", category:"攻撃", rarity:"コモン", ct:1, execution:"INSTANT",
    basePower:7, main:"DEX", hit:92,
    formula:"7 × (1 + √DEX × 0.12)",
    description:"即時実行。軽い攻撃を挟み、ターンを継続する。"
  },
  {
    id:"M003", name:"応急修復", category:"回復", rarity:"アンコモン", ct:3, execution:"STANDARD",
    basePower:8, main:"INT", hit:100,
    formula:"8 × (1 + √INT × 0.12)",
    description:"自身のHPを回復する。"
  },
  {
    id:"M004", name:"防壁展開", category:"防御", rarity:"アンコモン", ct:2, execution:"INSTANT",
    basePower:6, main:"INT", hit:100,
    formula:"6 × (1 + √INT × 0.12)",
    description:"即時実行。次に受けるダメージを軽減する防壁を得る。"
  }
];

const ENEMIES = [
  {id:"E01",name:"廃棄ドローン",baseHp:30,atk:6,pattern:["ATTACK","ATTACK","GUARD"]},
  {id:"E02",name:"違法義体狩り",baseHp:39,atk:8,pattern:["ATTACK","HEAVY","ATTACK"]},
  {id:"E03",name:"逆接僧兵",baseHp:48,atk:9,pattern:["GUARD","HEAVY","ATTACK"]}
];

const STORAGE_KEY = "nehan_alpha_v1";
const el = document.querySelector("#app");
let state = load() || freshState();
const combatResolutionTimers=new WeakMap();

function freshState(){
  return {slots:[null,null,null], activeSlot:null, screen:"home", run:null};
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function load(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function rand(min,max){ return Math.random()*(max-min)+min; }
function irand(min,max){ return Math.floor(rand(min,max+1)); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function statLabel(k){ return {VIT:"体力",STR:"腕力",DEX:"器用",INT:"頭脳"}[k] || k; }

function createCharacter(name){
  return {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    name: name || "NO-NAME",
    stats:{VIT:10,STR:8,DEX:8,INT:8},
    maxHp:42,
    hp:42,
    weapon:{id:"W001",name:"鉄管ブレード",basePower:9,hit:90},
    memories:MEMORIES.map(m=>({
      definitionId:m.id,currentCT:0,breakageRate:0,broken:false,modules:[]
    })),
    depth:0,
    wins:0,
    createdAt:Date.now()
  };
}

function calcScaled(base, stat){
  return Math.max(1, Math.round(base * (1 + Math.sqrt(Math.max(0,stat)) * 0.12)));
}
function getMemDef(inst){ return MEMORIES.find(m=>m.id===inst.definitionId); }

function newRun(char){
  char.hp = char.maxHp;
  char.depth = 0;
  char.wins = 0;
  char.memories.forEach(m=>m.currentCT=0);
  return {
    depth:0,
    phase:"map",
    shield:0,
    combat:null,
    routes:makeRoutes(0),
    log:[]
  };
}

function makeRoutes(depth){
  const mk = side => {
    const e = ENEMIES[(depth + (side==="R"?1:0)) % ENEMIES.length];
    const futureA = ENEMIES[(depth+1+(side==="R"?1:0))%ENEMIES.length].name;
    const futureB = ENEMIES[(depth+2+(side==="R"?1:0))%ENEMIES.length].name;
    return {side,enemyId:e.id,future:[futureA,futureB]};
  };
  return [mk("L"),mk("R")];
}

function top(){
  return `<div class="topline"><div class="brand">NEHAN</div><div class="alpha">電脳涅槃 / ALPHA</div></div>`;
}
function footer(){
  return `<div class="footer">NEHAN</div>`;
}

function render(){
  el.dataset.screen = state.screen === "run" ? (state.run?.phase || "map") : state.screen;
  if(state.screen==="home") return renderHome();
  if(state.screen==="play") return renderPlay();
  if(state.screen==="create") return renderCreate();
  if(state.screen==="run") return renderRun();
  if(state.screen==="inventory") return renderInventory();
  return renderPlaceholder(state.screen);
}

let homeSelection=0;
function renderHome(){
  const items=[
    ["play","PLAY","続きから / キャラクター作成"],
    ["inventory","INVENTORY","メモリ / モジュール"],
    ["shop","SHOP","ALPHA: 未実装"],
    ["archive","ARCHIVE","ALPHA: 未実装"],
    ["lost","LOST LOG","ALPHA: 未実装"],
    ["settings","SETTINGS","ALPHA: 未実装"]
  ];
  el.innerHTML=`
    <section class="home-intro"><h1>NEHAN</h1></section>
    <section class="home-selector" aria-label="ホームメニュー">
      <div class="drum-stage" tabindex="0" role="group" aria-label="上下にスワイプしてメニューを選択。Enterで開く。">
        <div class="drum-focus" aria-hidden="true"></div>
        <div class="menu-drum">${items.map(([nav,title,meta],i)=>`<button class="drum-item" data-nav="${nav}" data-drum-index="${i}" style="--face-angle:${-i*60}deg"><span class="drum-title">${title}</span><span class="drum-meta">${meta}</span></button>`).join("")}</div>
      </div>
      <div class="drum-navigation"><span id="drumPosition" aria-live="polite"></span></div>
    </section>`;
  const stage=el.querySelector('.drum-stage'), drum=el.querySelector('.menu-drum');
  const buttons=[...el.querySelectorAll('.drum-item')];
  let position=homeSelection, drag=null, suppressClick=false, wheelTime=0;
  const selected=()=>((Math.round(position)%items.length)+items.length)%items.length;
  function paint(animate=true){
    drum.classList.toggle('dragging',!animate);
    drum.style.transform=`translateZ(calc(-1 * var(--drum-radius))) rotateX(${position*60}deg)`;
    const center=selected();
    buttons.forEach((b,i)=>{
      b.classList.toggle('selected',i===center);
      b.setAttribute('aria-current',i===center?'true':'false');
      b.tabIndex=i===center?0:-1;
      // Hide the rear faces from interaction and assistive technology.
      const angle=((i-position)*60%360+540)%360-180;
      b.inert=Math.abs(angle)>90;
    });
    el.querySelector('#drumPosition').textContent=`0${center+1} / 06`;
    el.querySelector('#drumPosition').setAttribute('aria-label',`${items[center][1]}、${center+1} / 6`);
  }
  function snap(next){position=Math.round(next);homeSelection=selected();paint();}
  function open(){state.screen=items[selected()][0];save();render();}
  buttons.forEach((b,i)=>b.onclick=()=>{
    if(suppressClick){suppressClick=false;return;}
    if(i===selected()){open();return;}
    const delta=((i-selected()+9)%6)-3;
    snap(position+delta);
  });
  stage.onkeydown=e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();snap(position+(e.key==='ArrowDown'?1:-1));stage.focus();}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}
    else if(e.key==='Home'){e.preventDefault();snap(0);}
    else if(e.key==='End'){e.preventDefault();snap(5);}
  };
  stage.onpointerdown=e=>{
    if(!e.isPrimary||e.button!==0)return;
    suppressClick=false;drag={id:e.pointerId,y:e.clientY,start:position,moved:false};
  };
  stage.onpointermove=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const distance=e.clientY-drag.y;
    if(Math.abs(distance)>8&&!drag.moved){drag.moved=true;stage.setPointerCapture(e.pointerId);}
    if(drag.moved){position=drag.start-distance/90;paint(false);}
  };
  function endDrag(e,cancelled=false){
    if(!drag||e.pointerId!==drag.id)return;
    const current=drag;drag=null;
    if(current.moved){suppressClick=true;snap(cancelled?current.start:position);}
    if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);
  }
  stage.onpointerup=e=>endDrag(e);
  stage.onpointercancel=e=>endDrag(e,true);
  stage.onlostpointercapture=e=>endDrag(e,true);
  stage.addEventListener('wheel',e=>{
    e.preventDefault();if(Math.abs(e.deltaY)<3||performance.now()-wheelTime<180)return;
    wheelTime=performance.now();snap(position+Math.sign(e.deltaY));
  },{passive:false});
  paint(false);
}

function renderPlay(){
  const slots = state.slots.map((c,i)=>{
    if(!c) return `<button class="btn slot empty" data-new="${i}"><div class="kicker">SLOT 0${i+1}</div><div class="name">EMPTY</div><div class="meta">新規キャラクター作成</div></button>`;
    return `<button class="btn slot" data-slot="${i}">
      <div class="kicker">SLOT 0${i+1}</div>
      <div class="name">${esc(c.name)}</div>
      <div class="meta">HP ${c.hp}/${c.maxHp} / STR ${c.stats.STR} / DEX ${c.stats.DEX} / INT ${c.stats.INT}<br>最深部 ${c.depth}</div>
    </button>`;
  }).join("");
  el.innerHTML = top()+`
  <section class="panel"><div class="kicker">PLAY</div><h2>CHARACTER SLOTS</h2><p class="small muted">最大3体。死亡したキャラクターは消失します。</p></section>
  <section class="grid grid3">${slots}</section>
  <button class="btn ghost" data-nav="home">← HOME</button>`+footer();
  document.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>{state.activeSlot=+b.dataset.new;state.screen="create";save();render();});
  document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{
    state.activeSlot=+b.dataset.slot;
    const c=state.slots[state.activeSlot];
    if(!state.run || state.run.ownerId!==c.id){
      state.run=newRun(c); state.run.ownerId=c.id;
    }
    state.screen="run"; save(); render();
  });
  bindNav();
}

function renderCreate(){
  el.innerHTML=top()+`
  <section class="panel">
    <div class="kicker">NEW BODY</div><h2>キャラクター作成</h2>
    <label class="small muted">呼称</label>
    <input id="nameInput" type="text" maxlength="16" placeholder="NAME" value="名無し">
    <div style="height:12px"></div>
    <div class="stats">
      <div class="stat"><span>VIT</span><b>10</b></div>
      <div class="stat"><span>STR</span><b>8</b></div>
      <div class="stat"><span>DEX</span><b>8</b></div>
      <div class="stat"><span>INT</span><b>8</b></div>
    </div>
    <p class="rule-note">ALPHAでは初期ステータスを固定しています。職業・初期値は正式仕様では未確定です。</p>
    <button class="btn primary" id="createBtn"><div class="title">BODY INITIALIZE</div><div class="meta">この身体でNEHANへ入る</div></button>
  </section>
  <button class="btn ghost" data-nav="play">← BACK</button>`+footer();
  document.querySelector("#createBtn").onclick=()=>{
    const name=document.querySelector("#nameInput").value.trim()||"名無し";
    const c=createCharacter(name);
    state.slots[state.activeSlot]=c;
    state.run=newRun(c);state.run.ownerId=c.id;state.screen="run";save();render();
  };
  bindNav();
}

function renderRun(){
  const c=state.slots[state.activeSlot];
  if(!c){state.screen="play";save();return render();}
  if(!state.run || state.run.ownerId!==c.id){state.run=newRun(c);state.run.ownerId=c.id;}
  if(state.run.phase==="combat") return renderCombat(c);
  if(state.run.phase==="dead") return renderDeath(c);
  return renderMap(c);
}

function charHeader(c){
  return `<section class="panel player-panel">
    <div class="combat-head">
      <div><div class="kicker">${esc(c.name)} / DEPTH ${state.run.depth}</div><h3 style="margin:3px 0">HP ${c.hp} / ${c.maxHp} ${state.run.shield?`<span class="shield">+ SHIELD ${state.run.shield}</span>`:""}</h3></div>
      <button class="btn ghost small" id="exitRun" style="width:auto;padding:7px">HOME</button>
    </div>
    <div class="hpbar"><i style="width:${clamp(c.hp/c.maxHp*100,0,100)}%"></i></div>
    <div class="stats" style="margin-top:8px">
      ${Object.entries(c.stats).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("")}
    </div>
  </section>`;
}

function renderMap(c){
  const routes=state.run.routes;
  const nodeIcon=`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="m7 25 18-18 3-3v7L12 27M4 20l8 8M5 27l3-3"/></svg>`;
  // TODO(要確認): イベント・闇市のルールは未定義。現在の戦闘ルートと予告データを表示する。
  el.innerHTML=`
  <section class="battle-viewport map-viewport" aria-label="マップ選択">
    <div class="battle-canvas map-canvas">
      <img class="battle-background" src="assets/map-stage.webp" alt="" aria-hidden="true" width="864" height="1536">
      <div class="enemy-status map-progress">
        <div class="battle-name">DEPTH ${state.run.depth}</div>
        <div class="battle-status-note">最深部 ${c.depth} · 踏破 ${c.wins}</div>
      </div>
      <button class="enemy-intent map-info" id="mapInfo" aria-label="進路の詳細" aria-describedby="actionDescription"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12"/><path d="M16 14v10M16 8v2"/></svg></button>
      <button class="battle-menu" id="exitRun" aria-label="ホームへ戻る"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8h22M5 16h22M5 24h22"/></svg></button>
      <div class="map-nodes" aria-label="進路">
        ${routes.map((r,i)=>{
          return `<button class="map-node map-choice" data-route="${r.side}" style="--node-x:${i?60.07:24.19}%" aria-label="戦闘" aria-describedby="actionDescription">${nodeIcon}<span class="map-node-kind">戦闘</span></button>
            ${r.future.map((_,j)=>`<button class="map-node map-preview" data-preview="${i}-${j}" style="--node-x:${[18.06,35.65,54.4,71.99][i*2+j]}%" aria-label="次の候補：戦闘" aria-describedby="actionDescription">${nodeIcon}<span class="map-node-kind">戦闘</span></button>`).join("")}`;
        }).join("")}
      </div>
      <button class="player-status player-health" id="playerDetails" aria-label="プレイヤーステータス詳細" aria-describedby="actionDescription">
        <div class="battle-name">${esc(c.name)}</div>
        <div class="hpbar"><i style="width:${clamp(c.hp/c.maxHp*100,0,100)}%"></i><span class="hp-value">${c.hp} / ${c.maxHp}</span></div>
        <div class="battle-status-note">${state.run.shield?`SHIELD ${state.run.shield}`:""}</div>
      </button>
      <section class="battle-controls map-equipment" aria-label="装備確認">
        <div id="actionDescription" class="action-description hidden" role="tooltip"></div>
        <div class="action-icons">
          <div class="action-cell"><button class="action-icon weapon-icon" id="weaponBtn" aria-disabled="true" aria-label="武器 ${esc(c.weapon.name)}、詳細" aria-describedby="actionDescription"><img src="assets/action-weapon.svg" alt=""></button><span class="action-name">${esc(c.weapon.name)}</span></div>
          ${c.memories.map((m,i)=>renderMemory(c,m,i,true)).join("")}
        </div>
      </section>
    </div>
  </section>`;
  document.querySelector("#exitRun").onclick=()=>{state.screen="home";save();render();};
  document.querySelectorAll("[data-route]").forEach(button=>{
    const r=routes.find(x=>x.side===button.dataset.route);
    bindActionHold(button,()=>`<b>戦闘</b><p>深度 ${state.run.depth}</p><p>次の候補：${r.future.map(()=>"戦闘").join(" / ")}</p>`,()=>startCombat(button.dataset.route));
  });
  document.querySelectorAll("[data-preview]").forEach(button=>{
    bindActionHold(button,()=>`<b>次の候補</b><p>戦闘</p>`,()=>{});
  });
  bindActionHold(document.querySelector("#mapInfo"),()=>`<b>DEPTH ${state.run.depth}</b><p>${routes.map(r=>`戦闘 → ${r.future.map(()=>"戦闘").join(" / ")}`).join("<br>")}</p>`,()=>{});
  bindActionHold(document.querySelector("#playerDetails"),()=>`<b>${esc(c.name)}</b><p>${Object.entries(c.stats).map(([k,v])=>`${k} ${v}`).join(" / ")}</p><p>HP ${c.hp} / ${c.maxHp} · SHIELD ${state.run.shield}</p>`,()=>{});
  bindActionHold(document.querySelector("#weaponBtn"),()=>`<b>${esc(c.weapon.name)}</b><p>威力 ${calcScaled(c.weapon.basePower,c.stats.STR)} / 命中 ${c.weapon.hit}%</p>`,()=>{});
  document.querySelectorAll("[data-memory]").forEach(button=>{
    bindActionHold(button,()=>memoryDescription(c,c.memories[+button.dataset.memory]),()=>{});
  });
}

function startCombat(side){
  const route=state.run.routes.find(r=>r.side===side);
  const base=ENEMIES.find(e=>e.id===route.enemyId);
  const d=state.run.depth;
  const hp=base.baseHp + d*5;
  state.run.combat={
    enemy:{...base,maxHp:hp,hp,guard:0,turn:0},
    intent:null,
    log:[]
  };
  chooseEnemyIntent();
  state.run.phase="combat";
  logMsg(`${base.name} と接触。`,"sys");
  save();render();
}

function chooseEnemyIntent(){
  const e=state.run.combat.enemy;
  const kind=e.pattern[e.turn % e.pattern.length];
  if(kind==="ATTACK") state.run.combat.intent={kind,damage:e.atk+Math.floor(state.run.depth/2),label:"攻撃"};
  else if(kind==="HEAVY") state.run.combat.intent={kind,damage:e.atk+4+Math.floor(state.run.depth/2),label:"強攻撃"};
  else state.run.combat.intent={kind,damage:0,label:"防御"};
}

function renderCombat(c){
  const combat=state.run.combat, e=combat.enemy, intent=combat.intent;
  const busy=!!combat.pendingAction;
  const enemyArt={E01:"sentinel",E02:"hunter",E03:"monk"}[e.id]||"sentinel";
  // All overlays share the complete 864 × 1536 artwork coordinate system.
  el.innerHTML=`
  <section class="battle-viewport" aria-label="戦闘">
    <div class="battle-canvas battle-scene">
      <img class="battle-background" src="assets/battle-stage.webp" alt="" aria-hidden="true" width="864" height="1536">
      <div class="enemy-status enemy-health">
        <div class="battle-name">${esc(e.name)}</div>
        <div class="hpbar"><i style="width:${clamp(e.hp/e.maxHp*100,0,100)}%"></i><span class="hp-value">${e.hp} / ${e.maxHp}</span></div>
        <div class="battle-status-note">${e.guard?`GUARD ${e.guard} · `:""}DEPTH ${state.run.depth}</div>
      </div>
      <button class="enemy-intent" id="enemyIntent" aria-label="次の行動：${esc(intent.label)}${intent.damage?`、${intent.damage}ダメージ`:"、防御態勢"}" aria-describedby="actionDescription">
        <svg viewBox="0 0 32 32" aria-hidden="true">${intent.kind==="GUARD"?`<path d="M16 3 27 8v10c0 6-11 11-11 11S5 24 5 18V8Z"/>`:`<path d="m7 25 18-18 3-3v7L12 27M4 20l8 8M5 27l3-3"/>${intent.kind==="HEAVY"?`<path d="M6 4v8M2 8h8"/>`:""}`}</svg>
        <span>${esc(intent.label)}${intent.damage?` ${intent.damage}`:""}</span>
      </button>
      <button class="battle-menu" id="exitRun" aria-label="ホームへ戻る"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8h22M5 16h22M5 24h22"/></svg></button>
      <div class="enemy-figure"><img class="${combat.feedback?.target==="enemy"&&combat.feedback.value>0?"damage-flash":""}" src="assets/${enemyArt}.svg" alt="${esc(e.name)}">${damagePopup(combat,"enemy")}</div>
      <div class="battle-message" role="status">${combat.log.slice(-2).map(x=>`<div class="${x.cls||""}">${esc(x.text)}</div>`).join("")}</div>
      <div class="player-figure"><img class="${combat.feedback?.target==="player"&&combat.feedback.value>0?"damage-flash":""}" src="assets/protagonist.svg" alt="${esc(c.name)}">${damagePopup(combat,"player")}</div>
      <button class="player-status player-health" id="playerDetails" aria-label="プレイヤーステータス詳細" aria-describedby="actionDescription">
        <div class="battle-name">${esc(c.name)}</div>
        <div class="hpbar"><i style="width:${clamp(c.hp/c.maxHp*100,0,100)}%"></i><span class="hp-value">${c.hp} / ${c.maxHp}</span></div>
        <div class="battle-status-note">${state.run.shield?`SHIELD ${state.run.shield}`:""}</div>
      </button>
      <section class="battle-controls" aria-label="行動選択">
        <div id="actionDescription" class="action-description hidden" role="tooltip"></div>
        <div class="action-icons">
          <div class="action-cell"><button class="action-icon weapon-icon" id="weaponBtn" aria-disabled="${busy}" aria-label="武器 ${esc(c.weapon.name)}" aria-describedby="actionDescription"><img src="assets/action-weapon.svg" alt=""></button><span class="action-name">${esc(c.weapon.name)}</span></div>
          ${c.memories.map((m,i)=>renderMemory(c,m,i)).join("")}
        </div>
      </section>
    </div>
  </section>`;
  document.querySelector("#exitRun").onclick=()=>{state.screen="home";save();render();};
  bindActionHold(document.querySelector("#weaponBtn"),()=>`<b>${esc(c.weapon.name)}</b><span class="tag std">標準実行</span><p>敵に ${calcScaled(c.weapon.basePower,c.stats.STR)} ダメージ / 命中 ${c.weapon.hit}%</p><p>使用するとターン終了。</p><p class="muted">${c.weapon.basePower} × (1 + √STR × 0.12)</p>`,()=>useWeapon(c));
  document.querySelectorAll("[data-memory]").forEach(button=>{
    const i=+button.dataset.memory, m=c.memories[i], d=getMemDef(m);
    bindActionHold(button,()=>memoryDescription(c,m),()=>{if(!m.broken&&m.currentCT===0)useMemory(c,i);});
  });
  bindActionHold(document.querySelector("#playerDetails"),()=>`<b>${esc(c.name)}</b><p>${Object.entries(c.stats).map(([k,v])=>`${k} ${v}`).join(" / ")}</p><p>HP ${c.hp} / ${c.maxHp} · SHIELD ${state.run.shield}</p>`,()=>{});
  bindActionHold(document.querySelector("#enemyIntent"),()=>`<b>次の行動：${esc(intent.label)}</b><p>${intent.damage?`${intent.damage} ダメージ`:"防御態勢"}</p>`,()=>{});
  scheduleCombatResolution(c);
}

function renderMemory(c,m,i,readOnly=false){
  return `<div class="action-cell"><button class="action-icon memory ${m.broken?"broken":""}" data-memory="${i}" aria-label="メモリ${i+1} ${esc(getMemDef(m).name)}" aria-disabled="${readOnly||!!state.run.combat?.pendingAction||m.currentCT>0||m.broken}" aria-describedby="actionDescription"><img src="assets/action-${i+1}.svg" alt="">${m.broken?`<span class="action-ct">×</span>`:m.currentCT?`<span class="action-ct">${m.currentCT}</span>`:""}</button><span class="action-name">${esc(getMemDef(m).name)}</span></div>`;
}
function memoryDescription(c,m){
  const d=getMemDef(m), val=calcScaled(d.basePower,c.stats[d.main]);
  const effect=d.category==="回復"?`HPを ${val} 回復`:d.category==="防御"?`防壁 ${val} を得る`:`敵に ${val} ダメージ / 命中 ${d.hit}%`;
  return `<b>${esc(d.name)}</b><span class="tag ${d.execution==="STANDARD"?"std":"inst"}">${d.execution==="STANDARD"?"標準実行":"即時実行"}</span><p>${effect}</p><p>CT ${m.currentCT}/${d.ct} / 破損率 ${m.breakageRate.toFixed(2)}%${m.broken?" / BROKEN":m.currentCT?" / 待機中":""}</p><p>${d.execution==="STANDARD"?"使用するとターン終了。":"使用後も行動を継続。"} ${esc(d.description)}</p><p class="muted">${esc(d.formula)}<br>現在の破損率で判定後、破損率 +0.0〜0.5%。</p>`;
}
// A held or cancelled gesture never activates an action on release.
// aria-disabled keeps cooling/broken memories inspectable while guarding execution.
function bindActionHold(button,describe,execute){
  let timer=null,held=false,suppressClick=false,startX=0,startY=0;
  const box=document.querySelector("#actionDescription");
  const hide=()=>{clearTimeout(timer);timer=null;box.classList.add("hidden");};
  const start=()=>{hide();held=false;suppressClick=false;timer=setTimeout(()=>{held=true;suppressClick=true;box.innerHTML=describe();box.classList.remove("hidden");},380);};
  button.onpointerdown=e=>{
    if(!e.isPrimary||e.button!==0)return;
    startX=e.clientX;startY=e.clientY;start();button.setPointerCapture(e.pointerId);
  };
  button.onpointermove=e=>{if(timer&&Math.hypot(e.clientX-startX,e.clientY-startY)>12){suppressClick=true;hide();}};
  button.onpointerup=()=>{if(held)suppressClick=true;hide();};
  button.onpointercancel=()=>{suppressClick=true;hide();};
  button.onlostpointercapture=hide;
  button.oncontextmenu=e=>e.preventDefault();
  button.onkeydown=e=>{if(e.key==="Enter")suppressClick=false;if(e.key===" "&&!e.repeat)start();};
  button.onkeyup=e=>{if(e.key===" "){if(held)suppressClick=true;hide();}};
  button.onblur=()=>{suppressClick=true;hide();};
  button.onclick=e=>{if(suppressClick){e.preventDefault();suppressClick=false;return;}hide();execute();};
}

function rollHit(rate){ return Math.random()*100 < rate; }
function applyEnemyDamage(raw){
  const e=state.run.combat.enemy;
  let dmg=raw;
  if(e.guard>0){const cut=Math.min(e.guard,dmg);dmg-=cut;e.guard-=cut;}
  e.hp=Math.max(0,e.hp-dmg);
  state.run.combat.feedback={target:"enemy",value:dmg};
  return dmg;
}
function logMsg(text,cls=""){
  if(!state.run?.combat) return;
  state.run.combat.log.push({text,cls});
  if(state.run.combat.log.length>80) state.run.combat.log.shift();
}

function useWeapon(c){
  if(state.run?.phase!=="combat"||state.run.combat.pendingAction)return;
  delete state.run.combat.feedback;
  if(!rollHit(c.weapon.hit)){
    logMsg(`${c.weapon.name}: MISS`,"bad");
  }else{
    const raw=calcScaled(c.weapon.basePower,c.stats.STR);
    const dealt=applyEnemyDamage(raw);
    logMsg(`${c.weapon.name}: ${dealt} damage`,"good");
  }
  finishPlayerAction(c,ALPHA.weaponEndsTurn);
}

function useMemory(c,index){
  if(state.run?.phase!=="combat"||state.run.combat.pendingAction)return;
  const inst=c.memories[index], d=getMemDef(inst);
  if(inst.currentCT>0 || inst.broken) return;
  delete state.run.combat.feedback;

  // CONFIRMED: 破損判定を先に行う。
  const broke=Math.random()*100 < inst.breakageRate;

  let resolved=true;
  if(broke){
    inst.broken=true;
    logMsg(`${d.name}: MEMORY BROKEN / 効果消失`,"bad");
    // TODO(要確認): 正式な破損時効果・同一使用の効果解決順。α版では破損した使用の効果を失敗扱い。
    resolved=false;
  }

  if(resolved){
    const value=calcScaled(d.basePower,c.stats[d.main]);
    if(d.category==="攻撃"){
      if(rollHit(d.hit)){
        const dealt=applyEnemyDamage(value);
        logMsg(`${d.name}: ${dealt} damage`,"good");
      }else logMsg(`${d.name}: MISS`,"bad");
    }else if(d.category==="回復"){
      const before=c.hp;c.hp=clamp(c.hp+value,0,c.maxHp);
      logMsg(`${d.name}: HP +${c.hp-before}`,"good");
    }else if(d.category==="防御"){
      state.run.shield+=value;
      logMsg(`${d.name}: SHIELD +${value}`,"good");
    }
  }

  inst.currentCT=d.ct;
  const add=rand(0,ALPHA.breakIncreaseMax);
  inst.breakageRate=clamp(inst.breakageRate+add,0,100);
  logMsg(`${d.name}: 破損率 +${add.toFixed(2)}% → ${inst.breakageRate.toFixed(2)}%`,"sys");

  finishPlayerAction(c,d.execution==="STANDARD");
}

function damagePopup(combat,target){
  const f=combat.feedback;
  return f?.target===target?`<span class="damage-popup" role="status" aria-label="${f.value} ダメージ">−${f.value}</span>`:"";
}
function finishPlayerAction(c,endsTurn){
  state.run.combat.pendingAction={stage:"player",endsTurn};
  save();render();scheduleCombatResolution(c);
}
function scheduleCombatResolution(c){
  const run=state.run, combat=run?.combat;
  if(!combat?.pendingAction||run.phase!=="combat"||combatResolutionTimers.has(combat))return;
  combatResolutionTimers.set(combat,setTimeout(()=>{
    combatResolutionTimers.delete(combat);
    if(state.run!==run||run.combat!==combat||run.phase!=="combat")return;
    const pending=combat.pendingAction;
    if(pending.stage==="player"){
      if(checkVictory(c))return;
      delete combat.feedback;
      if(pending.endsTurn){
        pending.stage="enemy";
        endPlayerTurn(c);
        scheduleCombatResolution(c);
        return;
      }
    }
    delete combat.pendingAction;delete combat.feedback;
    save();render();
  },combat.pendingAction.stage==="player"?750:650));
}

function checkVictory(c){
  const e=state.run.combat.enemy;
  if(e.hp>0) return false;
  logMsg(`${e.name} 排除。`,"good");
  c.wins++;c.depth=Math.max(c.depth,state.run.depth+1);
  state.run.depth++;
  state.run.phase="map";
  state.run.combat=null;
  state.run.routes=makeRoutes(state.run.depth);
  save();
  showResult("NODE CLEAR",`深度 ${state.run.depth} へ進行した。`,()=>render());
  return true;
}

function endPlayerTurn(c){
  const combat=state.run.combat,e=combat.enemy,intent=combat.intent;
  if(intent.kind==="ATTACK"||intent.kind==="HEAVY"){
    let dmg=intent.damage;
    const cut=Math.min(state.run.shield,dmg);
    state.run.shield-=cut;dmg-=cut;
    c.hp=Math.max(0,c.hp-dmg);
    combat.feedback={target:"player",value:dmg};
    logMsg(`${e.name}: ${intent.label} / ${dmg} damage${cut?` (SHIELD ${cut})`:""}`,"bad");
  }else{
    e.guard+=8+state.run.depth;
    logMsg(`${e.name}: GUARD +${8+state.run.depth}`,"bad");
  }

  if(c.hp<=0){
    delete combat.pendingAction;delete combat.feedback;
    state.run.phase="dead";save();return render();
  }

  e.turn++;
  chooseEnemyIntent();

  // CONFIRMED: 自分のターン開始時、装備中の全メモリCTを1減らす。
  c.memories.forEach(m=>m.currentCT=Math.max(0,m.currentCT-1));
  logMsg("PLAYER TURN // CT -1","sys");
  save();render();
}

function renderDeath(c){
  el.innerHTML=top()+`
  <section class="panel">
    <div class="kicker" style="color:var(--red)">CONNECTION LOST</div>
    <div class="screen-title">肉体反応、停止。</div>
    <p>${esc(c.name)} は NEHAN 深度 ${state.run.depth} で消失しました。</p>
    <p class="muted small">進行度報酬とメモリ回収は確定システムですが、報酬名・回収可能数・選択方式が未確定のためα版ではまだ処理しません。</p>
    <button class="btn danger" id="confirmDeath"><div class="title">ERASE BODY</div><div class="meta">キャラクタースロットを空にする</div></button>
  </section>`+footer();
  document.querySelector("#confirmDeath").onclick=()=>{
    state.slots[state.activeSlot]=null;
    state.run=null;state.screen="play";save();render();
  };
}

function renderInventory(){
  const owned=state.slots.filter(Boolean);
  el.innerHTML=top()+`
  <section class="panel"><div class="kicker">INVENTORY</div><h2>MEMORY / MODULE</h2>
  <p class="small muted">α版では生存中キャラクターに装備されたメモリ状態のみ確認できます。</p></section>
  ${owned.length?owned.map(c=>`<section class="panel inventory-panel"><h3>${esc(c.name)}</h3>${c.memories.map(m=>{const d=getMemDef(m);return `<div class="small" style="padding:7px 0;border-top:1px solid var(--line)">${esc(d.name)} / 破損率 ${m.breakageRate.toFixed(2)}% / ${m.broken?"BROKEN":"ACTIVE"}</div>`}).join("")}</section>`).join(""):`<section class="panel muted">保有データなし。</section>`}
  <button class="btn ghost" data-nav="home">← HOME</button>`+footer();
  bindNav();
}

function renderPlaceholder(name){
  const labels={shop:"SHOP",archive:"ARCHIVE",lost:"LOST LOG",settings:"SETTINGS"};
  el.innerHTML=top()+`<section class="panel"><div class="kicker">${labels[name]||name}</div><h2>ALPHA // NOT IMPLEMENTED</h2><p class="muted small">仕様が確定してから実装します。</p></section><button class="btn ghost" data-nav="home">← HOME</button>`+footer();
  bindNav();
}

function showResult(title,text,after){
  const div=document.createElement("div");
  div.className="modal";
  div.innerHTML=`<div class="modal-card"><div class="kicker">NEHAN SYSTEM</div><h2>${esc(title)}</h2><p>${esc(text)}</p><button class="btn primary" id="modalOk">CONTINUE</button></div>`;
  document.body.appendChild(div);
  div.querySelector("#modalOk").onclick=()=>{div.remove();after&&after();};
}

function bindNav(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{state.screen=b.dataset.nav;save();render();});
}

state.screen="home";
render();
const pendingCharacter=state.slots.find(c=>c?.id===state.run?.ownerId);
if(pendingCharacter)scheduleCombatResolution(pendingCharacter);
const splash=document.querySelector("#splash");
let splashTimer, closed=false;
function closeSplash(){
  if(closed) return;
  closed=true;clearTimeout(splashTimer);
  splash.classList.add("leaving");
  el.inert=false;
  setTimeout(()=>splash.remove(),450);
}
el.inert=true;
splash.onclick=closeSplash;
splash.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();closeSplash();}};
splashTimer=setTimeout(closeSplash,2400);
// Follow the visual viewport while the software keyboard is open, without scrolling.
if(window.visualViewport){
  const fitViewport=()=>{el.style.height=`${window.visualViewport.height}px`;};
  window.visualViewport.addEventListener("resize",fitViewport);
  fitViewport();
}
})();
</script>
