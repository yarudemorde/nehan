const RARITY_SLOTS={COMMON:1,UNCOMMON:2,RARE:3,EPIC:4,LEGENDARY:5};
function canonicalRarity(value){return {コモン:"COMMON",アンコモン:"UNCOMMON",レア:"RARE",エピック:"EPIC",レジェンダリー:"LEGENDARY"}[value]||(Object.hasOwn(RARITY_SLOTS,value)?value:"COMMON");}

function getModuleDef(instance){return MODULES.find(m=>m.id===instance?.definitionId);}
function normalizeModule(m){
  m.instanceId??=itemId();m.definitionId??=m.id;
  const d=getModuleDef(m);m.rarity=canonicalRarity(m.rarity||d?.rarity);m.generatedDepth??=null;
  // Missing legacy effects are snapshotted once; loading never generates new rolls.
  const effects=Array.isArray(m.effects)?m.effects:(d?.legacyEffects||[]);
  m.effects=effects.map(e=>({...e,target:e.target||e.stat}));m.effectCount=m.effects.length;
  return m;
}
function normalizeItem(item,rarity){
  item.instanceId??=itemId();item.rarity=canonicalRarity(item.rarity||rarity);
  if(getMemDef(item)){
    item.breakageRate=clamp(Number(item.breakageRate)||0,0,100);
    // Existing broken instances stay broken; reaching 100 always disables a Memory.
    item.broken=!!item.broken||item.breakageRate>=100;
  }
  item.moduleSlots=RARITY_SLOTS[item.rarity];item.modules??=[];
  const used=new Set();
  item.modules.forEach((m,i)=>{
    if(!m)return;normalizeModule(m);
    if(!Number.isInteger(m.slotIndex)||m.slotIndex<0||used.has(m.slotIndex)){
      let slot=i;while(used.has(slot))slot++;m.slotIndex=slot;
    }used.add(m.slotIndex);
  });
  // Accept legacy sparse arrays without deleting any installed instance.
  item.modules=item.modules.filter(Boolean);return item;
}
function createMemoryInstance(definitionId){

  return normalizeItem({definitionId,currentCT:0,breakageRate:0,broken:false,modules:[]},d.rarity);

function weightedChoice(entries,rng){
  const total=entries.reduce((n,e)=>n+e.weight,0);let roll=rng()*total;
  for(const e of entries){roll-=e.weight;if(roll<0)return e.value;}
  return entries.at(-1).value;
}
// TODO(要確認): 深度補正・効果数の抽選重み・数値レンジの最終バランス。
function modulePowerScale(depth){return 1+Math.min(60,Math.max(0,depth))*.03;}
function moduleEffectCount(depth,rng){
  const weights=depth<5?[[1,85],[2,15]]:depth<10?[[1,35],[2,65]]:depth<20?[[2,65],[3,35]]:depth<30?[[2,25],[3,45],[4,30]]:[[3,35],[4,65]];
  return weightedChoice(weights.map(([value,weight])=>({value,weight})),rng);
}
function createModuleInstance(definitionId,depth=0,rng=Math.random){
  const d=MODULES.find(m=>m.id===definitionId);if(!d)throw new Error("Unknown ModuleDefinition");
  const generatedDepth=Math.max(0,Math.floor(Number(depth)||0)),count=moduleEffectCount(generatedDepth,rng),scale=modulePowerScale(generatedDepth),effects=[];
  let pool=d.allowedEffects.map(key=>MODULE_EFFECT_RULES[key]).filter(Boolean);
  for(let i=0;i<count&&pool.length;i++){
    const rule=weightedChoice(pool.map(value=>({value,weight:d.preferredTargets.includes(value.target)?2:1})),rng);
    // A Module always has a positive first effect. Later effects can be penalties.
    const negative=i>0&&rng()<Math.min(.35,.15+Math.min(60,generatedDepth)*.003);
    const magnitude=Math.max(1,Math.round((rule.min+rng()*(rule.max-rule.min))*scale*(negative?.55:1)));
    effects.push({target:rule.target,mode:rule.mode,value:negative?-magnitude:magnitude});
    pool=pool.filter(e=>e.target!==rule.target);
  }
  return {instanceId:itemId(),definitionId,rarity:d.rarity,generatedDepth,effectCount:effects.length,effects};
}
function getModuleEffects(m){return m?.effects||getModuleDef(m)?.legacyEffects||[];}
function equippedModules(c){return [c.weapon,...c.memories].filter(Boolean).flatMap(item=>item.modules||[]).filter(Boolean);}
function applyModuleModifiers(base,target,modules,minimum=0){
  let flat=0,percent=0;
  modules.forEach(m=>getModuleEffects(m).forEach(e=>{
    if((e.target||e.stat)!==target||!Number.isFinite(e.value))return;
    if(e.mode==="flat")flat+=e.value;else if(e.mode==="percent")percent+=e.value;
  }));
  return Math.max(minimum,Math.round((base+flat)*(1+percent/100)));
}

  const definition=ENEMIES.find(e=>e.id===enemy.id)||enemy;
  const pool=(definition.memoryPool||[]).filter(id=>MEMORIES.some(m=>m.id===id));
  if(rng()<.2&&pool.length)return {type:"MEMORY",item:createMemoryInstance(pool[Math.floor(rng()*pool.length)])};
  const modulePool=definition.modulePool?MODULES.filter(m=>definition.modulePool.includes(m.id)):MODULES;

  return {type:"MODULE",item:createModuleInstance(candidates[Math.floor(rng()*candidates.length)].id,depth,rng)};

  if(!canModifyEquipment(c)||!Number.isInteger(index)||index<0||index>=4||c.memories.length!==4)return false;
  const storedIndex=c.inventory.memories.findIndex(m=>m.instanceId===storageId);
  if(storedIndex<0||!getMemDef(c.inventory.memories[storedIndex]))return false;
  const equipped=c.memories[index],stored=c.inventory.memories[storedIndex];
  if(c.memories.some(m=>m.instanceId===stored.instanceId))return false;
  // Move complete instances: never rebuild from the MemoryDefinition.

function commitModuleSlot(c,moduleId,targetId,slot,overwrite,expectedOldId=null){
  if(!canModifyEquipment(c))return false;

  if(old)target.modules[target.modules.indexOf(old)]=incoming;else target.modules.push(incoming);

}

}

const combatResolutionTimers=new WeakMap();

function freshState(){
  return {slots:[null,null,null], activeSlot:null, screen:"home", run:null, createDraft:null};
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function load(){
  try { return normalizeState(JSON.parse(localStorage.getItem(STORAGE_KEY))); } catch { return null; }
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function rand(min,max){ return Math.random()*(max-min)+min; }
function irand(min,max){ return Math.floor(rand(min,max+1)); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function statLabel(k){ return {VIT:"体力",STR:"腕力",DEX:"器用",INT:"頭脳"}[k] || k; }

function normalizeState(saved){
  if(!saved||!Array.isArray(saved.slots))return null;
  saved.slots.forEach(c=>{
    if(!c)return;
    // Preserve every legacy stat, HP value, Memory state and installed Module.
    c.jobId??="LEGACY";
    c.inventory??={weapons:[],memories:[],modules:[]};c.inventory.weapons??=[];c.inventory.memories??=[];c.inventory.modules??=[];
    [...c.memories,...c.inventory.memories].forEach(m=>normalizeItem(m,getMemDef(m)?.rarity));
    c.inventory.modules.forEach(normalizeModule);
    for(const w of [c.weapon,...c.inventory.weapons].filter(Boolean)){
      w.mainStat??="STR";w.hitCount??=1;w.weaponType??="LEGACY";normalizeItem(w,"COMMON");
    }
    clampCharacterHp(c);
  });
  if(saved.run?.loot?.type==="MEMORY")normalizeItem(saved.run.loot.item,getMemDef(saved.run.loot.item)?.rarity);
  if(saved.run?.loot?.type==="MODULE")normalizeModule(saved.run.loot.item);
  const run=saved.run;
  if(run){
    const enemy=run.combat?.enemy,definition=enemy&&getEnemyDef(enemy);
    if(definition&&!enemy.moves){
      // Keep HP/guard/turn and the already-pending intent; update later choices to named moves.
      Object.assign(enemy,{name:definition.name,art:definition.art,faction:definition.faction,moves:definition.moves.map(m=>({...m})),pattern:[...definition.pattern]});
    }
    run.routes=(run.routes||[]).map((r,i)=>({...normalizeNode(r,run.depth,i?"R":"L"),side:r.side||(i?"R":"L")}));
    if(run.selectedNode)run.selectedNode=normalizeNode(run.selectedNode,run.depth);
    // Old main incremented depth before showing loot. Do not add it a second time.
    if(run.phase==="loot"&&run.lootDepthAdvanced===undefined)run.lootDepthAdvanced=true;
    if(run.scrapLoot){const item=run.scrapLoot.item;normalizeItem(item,run.scrapLoot.type==="MEMORY"?getMemDef(item)?.rarity:"COMMON");}
  }
  saved.createDraft??=null;
  return saved;
}
function newCreationDraft(slotIndex){
  return {slotIndex,name:"名無し",jobId:JOBS[0].id,weaponId:null,memoryIds:MEMORIES.slice(0,4).map(m=>m.id)};
}
function creationName(value){return Array.from(String(value||"").trim()).slice(0,16).join("")||"名無し";}
function validCreationDraft(d){
  if(!d)return false;
  const job=JOBS.find(x=>x.id===d.jobId),weapon=WEAPONS.find(x=>x.id===d.weaponId);
  return canEquipWeapon(job,weapon)&&Array.isArray(d.memoryIds)&&d.memoryIds.length===4&&new Set(d.memoryIds).size===4&&d.memoryIds.every(id=>MEMORIES.some(m=>m.id===id));
}
function createCharacter(draft){
  if(!validCreationDraft(draft))throw new Error("Invalid character loadout");
  const job=JOBS.find(x=>x.id===draft.jobId),weapon=WEAPONS.find(x=>x.id===draft.weaponId);
  // TODO(要確認): VITから最大HPを算出する正式式。現在は42を維持する。
  return {
    id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
    name:creationName(draft.name),jobId:job.id,stats:{...job.stats},maxHp:42,hp:42,
    weapon:normalizeItem({...weapon,modules:[]},weapon.rarity),
    memories:draft.memoryIds.map(createMemoryInstance),inventory:{weapons:[],memories:[],modules:[]},
    depth:0,wins:0,createdAt:Date.now()
  };
}

function calcScaled(base, stat){
  return Math.max(1, Math.round(base * (1 + Math.sqrt(Math.max(0,stat)) * 0.12)));
}
function getMemDef(inst){ return MEMORIES.find(m=>m.id===inst.definitionId); }
function memoryIcon(inst){const d=getMemDef(inst);return d.icon||`assets/action-${MEMORIES.indexOf(d)+1}.svg`;}

function newRun(char){
  char.hp = getEffectiveMaxHp(char);
  char.depth = 0;
  char.wins = 0;
  char.memories.forEach(m=>m.currentCT=0);
  return {
    depth:0,
    phase:"map",
    shield:0,
    combat:null,
    routes:makeRoutes(0),
    log:[]
  };
}

// Node behavior is registered once; future nodes are saved previews, never clickable routes.
const NODE_WEIGHTS={battle:60,garage:20,scrap:20};
const SCRAP_DROP={WEAPON:.5,MEMORY:.5};
const NODE_DEFINITIONS={
  battle:{label:"戦闘",shortLabel:"戦闘",icon:'<path d="m7 25 18-18 3-3v7L12 27M4 20l8 8M5 27l3-3"/>',enter:(node)=>startCombat(node.side)},
  garage:{label:"ガレージ",shortLabel:"GARAGE",icon:'<path d="M21 3a8 8 0 0 0-9 10L4 21a4 4 0 0 0 6 6l8-8a8 8 0 0 0 11-9l-6 5-5-5Z"/>',enter:(node,c)=>enterRestNode(c,node,"garage")},
  scrap:{label:"スクラップ置き場",shortLabel:"SCRAP",icon:'<path d="m4 10 12-6 12 6v16H4ZM4 10l12 6 12-6M16 16v10M10 7l12 6"/>',enter:(node,c)=>enterRestNode(c,node,"scrap")}
};
// TODO(要確認): ノード比率とScrapレア度分布の最終バランス。現在は初期実装パラメータ。
const SCRAP_RARITY_CURVE=[
  {depth:0,weights:[85,12,2.5,.4,.1]},
  {depth:10,weights:[55,28,13,3.5,.5]},
  {depth:20,weights:[25,30,30,13,2]},
  {depth:30,weights:[12,20,33,28,7]},
  {depth:50,weights:[5,10,25,38,22]}
];
function rollItemRarity(depth,rng=Math.random){
  const d=clamp(Number(depth)||0,0,50),upper=SCRAP_RARITY_CURVE.find(p=>p.depth>=d)||SCRAP_RARITY_CURVE.at(-1),lower=SCRAP_RARITY_CURVE.filter(p=>p.depth<=d).at(-1),t=upper.depth===lower.depth?0:(d-lower.depth)/(upper.depth-lower.depth);
  return weightedChoice(Object.keys(RARITY_SLOTS).map((value,i)=>({value,weight:lower.weights[i]+(upper.weights[i]-lower.weights[i])*t})),rng);
}
function createWeaponInstance(definitionId,rarity=null){
  const d=WEAPONS.find(w=>w.id===definitionId);if(!d)throw Error("Unknown WeaponDefinition");
  return normalizeItem({...d,rarity:rarity||d.rarity,modules:[]},d.rarity);
}
function generateScrapLoot(depth,rng=Math.random){
  const type=weightedChoice(Object.entries(SCRAP_DROP).map(([value,weight])=>({value,weight})),rng),definitions=type==="WEAPON"?WEAPONS:MEMORIES,d=definitions[Math.floor(rng()*definitions.length)],rarity=rollItemRarity(depth,rng);
  const item=type==="WEAPON"?createWeaponInstance(d.id,rarity):normalizeItem({...createMemoryInstance(d.id),rarity},rarity);
  item.generatedDepth=depth;return {type,item};
}
function makeNode(depth,side,rng){
  const type=weightedChoice(Object.entries(NODE_WEIGHTS).map(([value,weight])=>({value,weight})),rng);
  return {id:itemId(),type,...(type==="battle"?{enemyId:ENEMIES[(depth+(side==="R"?1:0))%ENEMIES.length].id}:{})};
}
function makeRoutes(depth,rng=Math.random,previews=null){
  return ["L","R"].map((side,i)=>({...((previews?.[i])||makeNode(depth,side,rng)),side,future:[makeNode(depth+1,"L",rng),makeNode(depth+1,"R",rng)]}));
}
function normalizeNode(node,depth=0,side="L"){
  if(typeof node==="string")node={type:"battle",enemyId:ENEMIES.find(e=>(e.name===node||e.legacyNames?.includes(node)))?.id};
  const result={...node,id:node?.id||itemId(),type:node?.type||"battle"};
  if(result.type==="battle")result.enemyId??=ENEMIES[(depth+(side==="R"?1:0))%ENEMIES.length].id;
  if(Array.isArray(node?.future))result.future=node.future.map((n,i)=>normalizeNode(n,depth+1,i?"R":"L"));
  return result;
}
function handleMapNode(side){
  const c=state.slots[state.activeSlot],run=state.run;
  if(!c||run?.ownerId!==c.id||run.phase!=="map")return false;
  const node=run.routes.find(r=>r.side===side),definition=NODE_DEFINITIONS[node?.type];
  if(!definition)return false;
  run.selectedNode=node;definition.enter(node,c);return true;
}
function enterRestNode(c,node,phase){
  if(state.run?.ownerId!==c.id||state.run.phase!=="map")return false;
  state.run.selectedNode=node;state.run.phase=phase;
  if(phase==="scrap")state.run.scrapLoot=generateScrapLoot(state.run.depth);
  save();render();return true;
}
function advanceDepth(c,expectedPhase,alreadyAdvanced=false){
  const run=state.run;if(!run||run.ownerId!==c.id||run.phase!==expectedPhase)return false;
  if(!alreadyAdvanced)run.depth++;
  c.depth=Math.max(c.depth,run.depth);
  const previews=run.selectedNode?.future;
  run.routes=makeRoutes(run.depth,Math.random,previews);run.phase="map";run.combat=null;
  delete run.selectedNode;delete run.scrapLoot;delete run.loot;delete run.lootDepthAdvanced;
  save();render();return true;
}
function completeGarage(c,repair=true){
  if(state.run?.ownerId!==c.id||state.run.phase!=="garage")return false;
  if(repair)c.hp=getEffectiveMaxHp(c);
  return advanceDepth(c,"garage");
}
function collectScrap(c){
  const run=state.run;if(run?.ownerId!==c.id||run.phase!=="scrap"||!run.scrapLoot)return false;
  const loot=run.scrapLoot;if(!["WEAPON","MEMORY"].includes(loot.type))return false;
  c.inventory[loot.type==="WEAPON"?"weapons":"memories"].push(loot.item);
  return advanceDepth(c,"scrap");
}
function nodeIcon(node){const d=NODE_DEFINITIONS[node.type];return `<svg viewBox="0 0 32 32" aria-hidden="true">${d?.icon||""}</svg>`;}
function nodeLabel(node,short=false){const d=NODE_DEFINITIONS[node.type];return d?(short?d.shortLabel:d.label):"未定義";}
function renderExploration(c,type){
  const garage=type==="garage",loot=state.run.scrapLoot;
  el.innerHTML=`<section class="battle-viewport exploration-viewport"><div class="battle-canvas exploration-canvas ${garage?"garage-canvas":"scrap-canvas"}">
    <img class="battle-background" src="assets/module-install-bg.webp" alt="" aria-hidden="true" width="864" height="1536">
    <header class="exploration-header"><h2>${garage?"GARAGE":"SCRAP YARD"}</h2><small>DEPTH ${state.run.depth}</small><button id="explorationHome" aria-label="ホームへ戻る">☰</button></header>
    <section class="exploration-panel">${garage?`<h3>肉体修復</h3><p>HP ${c.hp} / ${getEffectiveMaxHp(c)}</p><div class="garage-repair-preview">↓<br>${getEffectiveMaxHp(c)} / ${getEffectiveMaxHp(c)}</div><p class="small">HPのみ修復します。</p>`:`<p>廃棄物の中から<br>使用可能な部品を発見した。</p>${loot?`<div class="scrap-recovered"><small>${loot.type}</small>${equipmentSummary(loot.item)}<p>${loot.type==="WEAPON"?weaponStorageSpec(loot.item):`BASE POWER ${getMemDef(loot.item).basePower}<br>MAIN ${getMemDef(loot.item).main} · HIT ${getMemDef(loot.item).hit}% · CT ${getMemDef(loot.item).ct}`}<br>MODULE SLOT ${loot.item.moduleSlots}</p></div>`:""}`}</section>
    <div class="exploration-actions">${garage?`<button id="repairGarage">修復する</button><button id="leaveGarage">立ち去る</button>`:`<button id="collectScrap" ${loot?"":"disabled"}>回収</button>`}</div>
  </div></section>`;
  el.querySelector("#explorationHome").onclick=()=>{state.screen="home";save();render();};
  if(garage){el.querySelector("#repairGarage").onclick=()=>completeGarage(c,true);el.querySelector("#leaveGarage").onclick=()=>completeGarage(c,false);}
  else el.querySelector("#collectScrap").onclick=()=>collectScrap(c);
}

function top(){
  return `<div class="topline"><div class="brand">NEHAN</div><div class="alpha">電脳涅槃 / ALPHA</div></div>`;
}
function footer(){
  return `<div class="footer">NEHAN</div>`;

function render(){
  el.dataset.screen = state.screen === "run" ? (state.run?.phase || "map") : state.screen;
  if(state.screen==="home") return renderHome();
  if(state.screen==="play") return renderPlay();
  if(state.screen==="create") return renderCreate();
  if(state.screen==="run") return renderRun();
  if(state.screen==="inventory") return renderInventory();
  return renderPlaceholder(state.screen);
}

let homeSelection=0;
function renderHome(){
  const items=[
    ["play","PLAY","続きから / キャラクター作成"],
    ["inventory","INVENTORY","メモリ / モジュール"],
    ["shop","SHOP","ALPHA: 未実装"],
    ["archive","ARCHIVE","ALPHA: 未実装"],
    ["lost","LOST LOG","ALPHA: 未実装"],
    ["settings","SETTINGS","ALPHA: 未実装"]
  ];
  el.innerHTML=`
    <section class="home-intro"><h1>NEHAN</h1></section>
    <section class="home-selector" aria-label="ホームメニュー">
      <div class="drum-stage" tabindex="0" role="group" aria-label="上下にスワイプしてメニューを選択。Enterで開く。">
        <div class="drum-focus" aria-hidden="true"></div>
        <div class="menu-drum">${items.map(([nav,title,meta],i)=>`<button class="drum-item" data-nav="${nav}" data-drum-index="${i}" style="--face-angle:${-i*60}deg"><span class="drum-title">${title}</span><span class="drum-meta">${meta}</span></button>`).join("")}</div>
      </div>
      <div class="drum-navigation"><span id="drumPosition" aria-live="polite"></span></div>
    </section>`;
  const stage=el.querySelector('.drum-stage'), drum=el.querySelector('.menu-drum');
  const buttons=[...el.querySelectorAll('.drum-item')];
  let position=homeSelection, drag=null, suppressClick=false, wheelTime=0;
  const selected=()=>((Math.round(position)%items.length)+items.length)%items.length;
  function paint(animate=true){
    drum.classList.toggle('dragging',!animate);
    drum.style.transform=`translateZ(calc(-1 * var(--drum-radius))) rotateX(${position*60}deg)`;
    const center=selected();
    buttons.forEach((b,i)=>{
      b.classList.toggle('selected',i===center);
      b.setAttribute('aria-current',i===center?'true':'false');
      b.tabIndex=i===center?0:-1;
      // Hide the rear faces from interaction and assistive technology.
      const angle=((i-position)*60%360+540)%360-180;
      b.inert=Math.abs(angle)>90;
    });
    el.querySelector('#drumPosition').textContent=`0${center+1} / 06`;
    el.querySelector('#drumPosition').setAttribute('aria-label',`${items[center][1]}、${center+1} / 6`);
  }
  function snap(next){position=Math.round(next);homeSelection=selected();paint();}
  function open(){state.screen=items[selected()][0];save();render();}
  buttons.forEach((b,i)=>b.onclick=()=>{
    if(suppressClick){suppressClick=false;return;}
    if(i===selected()){open();return;}
    const delta=((i-selected()+9)%6)-3;
    snap(position+delta);
  });
  stage.onkeydown=e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();snap(position+(e.key==='ArrowDown'?1:-1));stage.focus();}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}
    else if(e.key==='Home'){e.preventDefault();snap(0);}
    else if(e.key==='End'){e.preventDefault();snap(5);}
  };
  stage.onpointerdown=e=>{
    if(!e.isPrimary||e.button!==0)return;
    suppressClick=false;drag={id:e.pointerId,y:e.clientY,start:position,moved:false};
  };
  stage.onpointermove=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const distance=e.clientY-drag.y;
    if(Math.abs(distance)>8&&!drag.moved){drag.moved=true;stage.setPointerCapture(e.pointerId);}
    if(drag.moved){position=drag.start-distance/90;paint(false);}
  };
  function endDrag(e,cancelled=false){
    if(!drag||e.pointerId!==drag.id)return;
    const current=drag;drag=null;
    if(current.moved){suppressClick=true;snap(cancelled?current.start:position);}
    if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);
  }
  stage.onpointerup=e=>endDrag(e);
  stage.onpointercancel=e=>endDrag(e,true);
  stage.onlostpointercapture=e=>endDrag(e,true);
  stage.addEventListener('wheel',e=>{
    e.preventDefault();if(Math.abs(e.deltaY)<3||performance.now()-wheelTime<180)return;
    wheelTime=performance.now();snap(position+Math.sign(e.deltaY));
  },{passive:false});
  paint(false);
}

function renderPlay(){
  const slots = state.slots.map((c,i)=>{
    if(!c) return `<button class="btn slot empty" data-new="${i}"><div class="kicker">SLOT 0${i+1}</div><div class="name">EMPTY</div><div class="meta">新規キャラクター作成</div></button>`;
    return `<button class="btn slot" data-slot="${i}">
      <div class="kicker">SLOT 0${i+1}</div>
      <div class="name">${esc(c.name)}</div>
      <div class="meta">${esc(JOBS.find(j=>j.id===c.jobId)?.name||"職業未設定")}<br>HP ${c.hp}/${getEffectiveMaxHp(c)} / STR ${c.stats.STR} / DEX ${c.stats.DEX} / INT ${c.stats.INT}<br>最深部 ${c.depth}</div>
    </button>`;
  }).join("");
  el.innerHTML = top()+`
  <section class="panel"><div class="kicker">PLAY</div><h2>CHARACTER SLOTS</h2><p class="small muted">最大3体。死亡したキャラクターは消失します。</p></section>
  <section class="grid grid3">${slots}</section>
  <button class="btn ghost" data-nav="home">← HOME</button>`+footer();
  document.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>{state.activeSlot=+b.dataset.new;if(state.createDraft?.slotIndex!==state.activeSlot)state.createDraft=newCreationDraft(state.activeSlot);state.screen="create";save();render();});
  document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{
    state.activeSlot=+b.dataset.slot;
    const c=state.slots[state.activeSlot];
    if(!state.run || state.run.ownerId!==c.id){
      state.run=newRun(c); state.run.ownerId=c.id;

    state.screen="run"; save(); render();
  });
  bindNav();
}

function openCreationEditor(kind){
  const d=state.createDraft,draft={...d,memoryIds:[...d.memoryIds]},job=JOBS.find(x=>x.id===draft.jobId);
  const titles={name:"名前",job:"職業",weapon:"武器",memory:"メモリ"};
  let body="";

  if(kind==="weapon")body=WEAPONS.map(w=>`<label class="creation-option"><input type="radio" name="creationWeapon" value="${w.id}" ${draft.weaponId===w.id?"checked":""} ${canEquipWeapon(job,w)?"":"disabled"}><span><b>${esc(w.name)}</b><span class="creation-option-detail">武器種 ${esc(weaponTypeLabel(w.weaponType))} · 攻撃 ${w.basePower}<br>命中 ${w.hit}% · ${w.mainStat} · ${w.hitCount} HIT</span></span></label>`).join("");
  if(kind==="memory")body=`<div class="creation-memory-slots">${draft.memoryIds.map((id,i)=>`<label>MEMORY 0${i+1}<select data-memory-slot="${i}" aria-label="メモリ${i+1}">${MEMORIES.map(m=>`<option value="${m.id}" ${m.id===id?"selected":""}>${esc(m.name)}</option>`).join("")}</select></label>`).join("")}</div><p class="creation-edit-note">選択済みのメモリを選ぶと、スロットを入れ替えます。</p>`;
  const editor=document.createElement("div");editor.className="creation-editor";
  editor.innerHTML=`<form class="creation-edit-card" role="dialog" aria-modal="true" aria-labelledby="creationEditorTitle"><h2 id="creationEditorTitle">${titles[kind]}</h2><div class="creation-edit-body">${body}</div><div class="creation-edit-actions"><button type="button" id="cancelCreationEdit">戻る</button><button type="submit" id="confirmCreationEdit">決定</button></div></form>`;
  const view=el.querySelector(".creation-viewport"),opener=el.querySelector(`[data-edit="${kind}"]`);view.inert=true;el.appendChild(editor);
  function close(){editor.remove();view.inert=false;opener.focus();}
  editor.querySelector("#cancelCreationEdit").onclick=close;
  editor.onkeydown=e=>{
    if(e.key==="Escape"){e.preventDefault();close();}
    if(e.key==="Tab"){
      const nodes=[...editor.querySelectorAll('button:not(:disabled),input:not(:disabled),select')],first=nodes[0],last=nodes[nodes.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  };
  editor.querySelectorAll("[data-memory-slot]").forEach(select=>select.onchange=()=>{
    const i=+select.dataset.memorySlot,other=draft.memoryIds.indexOf(select.value),old=draft.memoryIds[i];
    // TODO(要確認): 同一MemoryDefinitionの複数装備可否。現在は重複禁止。
    if(other!==-1&&other!==i)draft.memoryIds[other]=old;
    draft.memoryIds[i]=select.value;
    editor.querySelectorAll("[data-memory-slot]").forEach(node=>node.value=draft.memoryIds[+node.dataset.memorySlot]);
  });
  editor.querySelector("form").onsubmit=e=>{
    e.preventDefault();
    if(kind==="name")draft.name=creationName(editor.querySelector("#nameInput").value);
    if(kind==="job"){
      draft.jobId=editor.querySelector('input[name="creationJob"]:checked')?.value||null;
      if(!canEquipWeapon(JOBS.find(x=>x.id===draft.jobId),WEAPONS.find(x=>x.id===draft.weaponId)))draft.weaponId=null;
    }
    if(kind==="weapon")draft.weaponId=editor.querySelector('input[name="creationWeapon"]:checked')?.value||null;
    state.createDraft=draft;save();close();render();el.querySelector(`[data-edit="${kind}"]`).focus();
  };
  editor.querySelector("input:not(:disabled),select,button").focus();
}

function renderRun(){
  const c=state.slots[state.activeSlot];
  if(!c){state.screen="play";save();return render();}
  if(!state.run || state.run.ownerId!==c.id){state.run=newRun(c);state.run.ownerId=c.id;}
  if(state.run.phase==="combat") return renderCombat(c);
  if(state.run.phase==="loot") return renderLoot(c);
  if(state.run.phase==="garage"||state.run.phase==="scrap")return renderExploration(c,state.run.phase);
  if(state.run.phase==="dead") return renderDeath(c);
  return renderMap(c);
}

function startCombat(side){
  if(state.run?.phase!=="map")return false;
  const route=state.run.routes.find(r=>r.side===side);
  if(!route||route.type!=="battle")return false;
  state.run.selectedNode=route;
  const base=ENEMIES.find(e=>e.id===route.enemyId);
  const d=state.run.depth;
  const hp=base.baseHp + d*5;
  state.run.combat={
    enemy:{...base,maxHp:hp,hp,guard:0,turn:0},
    intent:null,
    log:[]
  };
  chooseEnemyIntent();
  state.run.phase="combat";
  logMsg(`${base.name} と接触。`,"sys");
  save();render();
}

function chooseEnemyIntent(){
  const e=state.run.combat.enemy,key=e.pattern[e.turn % e.pattern.length];
  const move=(e.moves||getEnemyDef(e)?.moves||[]).find(m=>m.id===key)||ENEMY_ACTIONS[key]||ENEMY_ACTIONS.ATTACK;
  const damage=move.kind==="GUARD"?0:Math.max(0,e.atk+Math.floor(state.run.depth/2)+(move.kind==="HEAVY"?4:0)+(move.damageBonus||0));
  state.run.combat.intent={...move,damage,hitCount:move.hitCount||1};
  if(move.kind==="GUARD")state.run.combat.intent.guard=(move.guardPower??8)+state.run.depth;
}

function renderMemory(c,m,i,readOnly=false){

function memoryEffectText(c,m){
  const d=getMemDef(m),val=calcScaled(getEffectiveBasePower(m),getEffectiveStats(c)[d.main]);
  return d.category==="回復"?`HPを ${val} 回復`:d.category==="防御"?`防壁 ${val} を得る`:`敵に ${val} ダメージ / 命中 ${d.hit}%`;
}
function memoryDescription(c,m){
  const d=getMemDef(m),effect=memoryEffectText(c,m);

  return `<b>${esc(d.name)}</b><span class="tag ${d.execution==="STANDARD"?"std":"inst"}">${d.execution==="STANDARD"?"標準実行":"即時実行"}</span><p>${effect}</p><p>CT ${m.currentCT}/${d.ct} / 破損率 ${m.breakageRate.toFixed(2)}%${m.broken?" / BROKEN":m.currentCT?" / 待機中":""}</p><p>${d.execution==="STANDARD"?"使用するとターン終了。":"使用後も行動を継続。"} ${esc(d.description)}</p><p class="muted">${esc(d.formula)}${getEffectiveBasePower(m)!==d.basePower?`<br>BASE POWER ${basePowerDescription(m)}`:""}<br>使用後に破損率 +0.0〜3.0%。100%で使用不能。</p>`;
}
// A held or cancelled gesture never activates an action on release.
// aria-disabled keeps cooling/broken memories inspectable while guarding execution.
function bindActionHold(button,describe,execute){
  let timer=null,held=false,suppressClick=false,startX=0,startY=0;
  const box=document.querySelector("#actionDescription");
  const hide=()=>{clearTimeout(timer);timer=null;box.classList.add("hidden");};
  const start=()=>{hide();held=false;suppressClick=false;timer=setTimeout(()=>{held=true;suppressClick=true;box.innerHTML=describe();box.classList.remove("hidden");},380);};
  button.onpointerdown=e=>{
    if(!e.isPrimary||e.button!==0)return;
    startX=e.clientX;startY=e.clientY;start();button.setPointerCapture(e.pointerId);
  };
  button.onpointermove=e=>{if(timer&&Math.hypot(e.clientX-startX,e.clientY-startY)>12){suppressClick=true;hide();}};
  button.onpointerup=()=>{if(held)suppressClick=true;hide();};
  button.onpointercancel=()=>{suppressClick=true;hide();};
  button.onlostpointercapture=hide;
  button.oncontextmenu=e=>e.preventDefault();
  button.onkeydown=e=>{if(e.key==="Enter")suppressClick=false;if(e.key===" "&&!e.repeat)start();};
  button.onkeyup=e=>{if(e.key===" "){if(held)suppressClick=true;hide();}};
  button.onblur=()=>{suppressClick=true;hide();};
  button.onclick=e=>{if(suppressClick){e.preventDefault();suppressClick=false;return;}hide();execute();};
}

function rollHit(rate){ return Math.random()*100 < rate; }
function applyEnemyDamage(raw){
  const e=state.run.combat.enemy;
  let dmg=raw;
  if(e.guard>0){const cut=Math.min(e.guard,dmg);dmg-=cut;e.guard-=cut;}
  e.hp=Math.max(0,e.hp-dmg);
  state.run.combat.feedback={target:"enemy",value:dmg};
  return dmg;
}
function logMsg(text,cls=""){
  if(!state.run?.combat) return;
  state.run.combat.log.push({text,cls});
  if(state.run.combat.log.length>80) state.run.combat.log.shift();
}

function useWeapon(c){
  if(state.run?.phase!=="combat"||state.run.combat.pendingAction)return;
  delete state.run.combat.feedback;
  if(!rollHit(c.weapon.hit)){
    logMsg(`${c.weapon.name}: MISS`,"bad");
  }else{
    const raw=weaponPower(c);
    const dealt=applyEnemyDamage(raw);
    logMsg(`${c.weapon.name}: ${dealt} damage`,"good");
  }
  finishPlayerAction(c,ALPHA.weaponEndsTurn);
}

function useMemory(c,index){
  if(state.run?.phase!=="combat"||state.run.combat.pendingAction)return;
  const inst=c.memories[index];if(!inst)return;
  const d=getMemDef(inst);if(!d)return;
  if(inst.breakageRate>=100){
    if(!inst.broken){inst.broken=true;save();render();}
    return;
  }
  if(inst.currentCT>0 || inst.broken) return;
  delete state.run.combat.feedback;

  // Resolve this use before cumulative wear; there is no probabilistic break check.
  const value=calcScaled(getEffectiveBasePower(inst),getEffectiveStats(c)[d.main]);
  if(d.category==="攻撃"){
    if(rollHit(d.hit)){
      const dealt=applyEnemyDamage(value);
      logMsg(`${d.name}: ${dealt} damage`,"good");
    }else logMsg(`${d.name}: MISS`,"bad");
  }else if(d.category==="回復"){
    const before=c.hp;c.hp=clamp(c.hp+value,0,getEffectiveMaxHp(c));
    logMsg(`${d.name}: HP +${c.hp-before}`,"good");
  }else if(d.category==="防御"){
    state.run.shield+=value;
    logMsg(`${d.name}: SHIELD +${value}`,"good");
  }

  inst.currentCT=d.ct;
  const add=Math.round(rand(0,ALPHA.breakIncreaseMax)*100)/100;
  inst.breakageRate=clamp(Math.round((inst.breakageRate+add)*100)/100,0,100);
  logMsg(`${d.name}: 破損率 +${add.toFixed(2)}% → ${inst.breakageRate.toFixed(2)}%`,"sys");
  if(inst.breakageRate>=100){
    inst.broken=true;
    logMsg(`${d.name}: MEMORY BROKEN / 破損率100%・使用不能`,"bad");
  }

  finishPlayerAction(c,d.execution==="STANDARD");
}

function damagePopup(combat,target){
  const f=combat.feedback;
  return f?.target===target?`<span class="damage-popup" role="status" aria-label="${f.value} ダメージ">−${f.value}</span>`:"";
}
function finishPlayerAction(c,endsTurn){
  state.run.combat.pendingAction={stage:"player",endsTurn};
  save();render();scheduleCombatResolution(c);
}
function scheduleCombatResolution(c){
  const run=state.run, combat=run?.combat;
  if(!combat?.pendingAction||run.phase!=="combat"||combatResolutionTimers.has(combat))return;
  combatResolutionTimers.set(combat,setTimeout(()=>{
    combatResolutionTimers.delete(combat);
    if(state.run!==run||run.combat!==combat||run.phase!=="combat")return;
    const pending=combat.pendingAction;
    if(pending.stage==="player"){
      if(checkVictory(c))return;
      delete combat.feedback;
      if(pending.endsTurn){
        pending.stage="enemy";
        endPlayerTurn(c);
        scheduleCombatResolution(c);
        return;
      }
    }
    delete combat.pendingAction;delete combat.feedback;
    save();render();
  },combat.pendingAction.stage==="player"?750:650));
}

function checkVictory(c){
  if(state.run?.phase!=="combat")return false;
  const e=state.run.combat.enemy;
  if(e.hp>0) return false;
  logMsg(`${e.name} 排除。`,"good");
  c.wins++;
  const defeatedDepth=state.run.depth;
  state.run.lootDepthAdvanced=false;
  state.run.loot=generateLoot(e,Math.random,defeatedDepth);state.run.phase="loot";
  state.run.combat=null;
  save();render();
  return true;
}

function endPlayerTurn(c){
  const combat=state.run.combat,e=combat.enemy,intent=combat.intent;
  if(intent.kind==="ATTACK"||intent.kind==="HEAVY"){
    // Damage retains the existing scaling. Burst hits divide that total, never multiply it.
    const hits=Math.max(1,intent.hitCount||1),pierce=clamp(intent.shieldPierce||0,0,1);
    let dealt=0,absorbed=0;
    for(let i=0;i<hits;i++){
      const raw=Math.floor(intent.damage/hits)+(i<intent.damage%hits?1:0);
      const bypass=Math.floor(raw*pierce),cut=Math.min(state.run.shield,raw-bypass);
      state.run.shield-=cut;absorbed+=cut;dealt+=raw-cut;
    }
    c.hp=Math.max(0,c.hp-dealt);
    combat.feedback={target:"player",value:dealt};
    logMsg(`${e.name}: ${intent.label}${hits>1?` / ${hits} HIT`:""} / ${dealt} damage${absorbed?` (SHIELD ${absorbed})`:""}`,"bad");
    if(intent.guardGain){e.guard+=intent.guardGain;logMsg(`${e.name}: 追加防御 +${intent.guardGain}`,"sys");}
  }else{
    const guard=intent.guard??8+state.run.depth;
    e.guard+=guard;
    logMsg(`${e.name}: ${intent.label} / GUARD +${guard}`,"bad");
  }

  if(c.hp<=0){
    delete combat.pendingAction;delete combat.feedback;
    state.run.phase="dead";save();return render();
  }

  e.turn++;
  chooseEnemyIntent();

  // CONFIRMED: 自分のターン開始時、装備中の全メモリCTを1減らす。
  c.memories.forEach(m=>m.currentCT=Math.max(0,m.currentCT-1));
  logMsg("PLAYER TURN // CT -1","sys");
  save();render();
}

function renderDeath(c){
  el.innerHTML=top()+`
  <section class="panel">
    <div class="kicker" style="color:var(--red)">CONNECTION LOST</div>
    <div class="screen-title">肉体反応、停止。</div>
    <p>${esc(c.name)} は NEHAN 深度 ${state.run.depth} で消失しました。</p>
    <p class="muted small">進行度報酬とメモリ回収は確定システムですが、報酬名・回収可能数・選択方式が未確定のためα版ではまだ処理しません。</p>
    <button class="btn danger" id="confirmDeath"><div class="title">ERASE BODY</div><div class="meta">キャラクタースロットを空にする</div></button>
  </section>`+footer();
  document.querySelector("#confirmDeath").onclick=()=>{
    state.slots[state.activeSlot]=null;
    state.run=null;state.screen="play";save();render();
  };
}

function moduleEffects(m){
  return getModuleEffects(m).map(e=>`<span class="modifier ${e.value<0?"negative":"positive"}">${esc({MAX_HP:"MAX HP",BASE_POWER:"BASE POWER"}[e.target||e.stat]||e.target||e.stat)} ${e.value>=0?"+":""}${e.value}${e.mode==="percent"?"%":""}</span>`).join("");
}
function itemName(item){return item.name||getMemDef(item)?.name||"未設定";}
function moduleSummary(m){const d=getModuleDef(m);return `<b>${esc(d?.name||m.definitionId||"旧モジュール")}</b><small>${esc(m.rarity||d?.rarity||"未設定")} · 取得深度 ${m.generatedDepth??"未記録"}</small><div class="module-effect-lines">${moduleEffects(m)}</div>`;}
function equipmentSummary(item){return `<b>${esc(itemName(item))}</b><small>${esc(item.rarity)} · MODULE ${item.modules.length}/${item.moduleSlots}</small>${item.modules.map((m,i)=>`<div class="installed-module"><small>SLOT ${(m.slotIndex??i)+1}</small>${moduleSummary(m)}</div>`).join("")}`;}
function renderLoot(c){
  const loot=state.run.loot;
  if(!loot)return;
  el.innerHTML=`<section class="loot-screen"><p class="kicker">RECOVERED ${loot.type}</p><div class="loot-item" role="status">${loot.type==="MEMORY"?`${equipmentSummary(loot.item)}<p>MODULE SLOT ${loot.item.moduleSlots}</p>`:moduleSummary(loot.item)}</div><button class="btn" id="collectLoot">回収</button></section>`;
  el.querySelector("#collectLoot").onclick=()=>collectLoot(c);
}
function weaponStorageSpec(w){return `BASE POWER ${basePowerDescription(w)} · MAIN ${weaponStatKey(w)}<br>HIT ${w.hit}% · HIT COUNT ${w.hitCount||1}`;}
function storageEquipmentList(c,type=null){
  const items=type==="weapons"?c.inventory.weapons:type==="memories"?c.inventory.memories:[...c.inventory.weapons,...c.inventory.memories];
  return items.map(item=>`<button class="inventory-item equipment-choice" data-equipment="${esc(item.instanceId)}"><small>${getMemDef(item)?"STORAGE MEMORY":"STORAGE WEAPON"}</small>${equipmentSummary(item)}${getMemDef(item)?"":`<small>${esc(item.weaponType)}<br>${weaponStorageSpec(item)}</small>`}</button>`).join("");
}
let inventoryCharacterId=null,inventoryTab="equipped";
function renderInventory(){
  const owned=state.slots.filter(Boolean),c=owned.find(c=>c.id===inventoryCharacterId)||owned[0];inventoryCharacterId=c?.id;
  el.innerHTML=`<section class="inventory-heading"><h2>INVENTORY</h2>${c?`<select id="inventoryCharacter" aria-label="キャラクター">${owned.map(x=>`<option value="${esc(x.id)}" ${x===c?"selected":""}>${esc(x.name)}</option>`).join("")}</select><p class="small">${statsDescription(c)}</p><div class="inventory-tabs">${[["equipped","EQUIPPED"],["weapons","WEAPONS"],["memories","MEMORIES"],["modules","MODULES"]].map(([id,label])=>`<button data-inventory-tab="${id}" aria-pressed="${inventoryTab===id}">${label}</button>`).join("")}</div>`:""}</section><section class="inventory-list inventory-panel">${!c?"保有データなし。":inventoryTab==="equipped"?equipmentList(c):inventoryTab==="weapons"||inventoryTab==="memories"?`<h3>STORAGE / ${inventoryTab.toUpperCase()}</h3>${storageEquipmentList(c,inventoryTab)||(inventoryTab==="weapons"?"所持武器なし。":"所持メモリなし。")}`:`<h3>STORAGE / MODULES</h3>${c.inventory.modules.map(m=>`<button class="inventory-item module-choice" data-install-module="${esc(m.instanceId)}" ${getModuleDef(m)&&canModifyEquipment(c)?"":"disabled"}>${moduleSummary(m)}<small>インストール先を選択 ›</small></button>`).join("")||"未使用モジュールなし。"}`}</section><button class="btn ghost" data-nav="home">← HOME</button>`;
  bindNav();
  el.querySelectorAll("[data-inventory-tab]").forEach(b=>b.onclick=()=>{inventoryTab=b.dataset.inventoryTab;renderInventory();});
  el.querySelectorAll("[data-equipment]").forEach(b=>b.onclick=()=>openModuleInstall(c,null,{targetId:b.dataset.equipment}));
  const selector=el.querySelector("#inventoryCharacter");if(selector)selector.onchange=()=>{inventoryCharacterId=selector.value;renderInventory();};
  el.querySelectorAll("[data-install-module]").forEach(b=>b.onclick=()=>openModuleInstall(c,b.dataset.installModule));
}
// Dialogs isolate the underlying run; combat timers keep their existing pacing.
function equipmentDialog(className,title,onClose=()=>{}){
  const parent=document.querySelector(".module-install-screen"),previousInert=el.inert,parentInert=parent?.inert;
  const opener=document.activeElement,overlay=document.createElement("div");overlay.className=`install-overlay ${className}`;
  overlay.innerHTML=`<section class="install-card" role="dialog" aria-modal="true" aria-labelledby="equipmentDialogTitle"><h3 id="equipmentDialogTitle">${esc(title)}</h3><div class="equipment-dialog-body"></div><button class="equipment-dialog-close">戻る</button></section>`;
  el.inert=true;if(parent)parent.inert=true;document.body.appendChild(overlay);
  const close=()=>{overlay.remove();el.inert=previousInert;if(parent?.isConnected)parent.inert=parentInert;if(opener?.isConnected)opener.focus();onClose();};
  overlay.querySelector(".equipment-dialog-close").onclick=close;
  overlay.onkeydown=e=>{
    if(e.key==="Escape"){e.preventDefault();close();}
    if(e.key==="Tab"){
      const nodes=[...overlay.querySelectorAll("button:not(:disabled)")],first=nodes[0],last=nodes.at(-1);
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  };
  return {overlay,body:overlay.querySelector(".equipment-dialog-body"),close};
}
// UI-only workbench: selected targets/slots are transient, all mutations use the shared APIs.
function openModuleInstall(c,moduleId=null,{targetId=null,slotIndex=null,onDone=()=>{render();el.querySelector("#playerDetails")?.focus();}}={}){
  if(document.querySelector(".module-install-screen"))return;
  const previousInert=el.inert,opener=document.activeElement;
  const screen=document.createElement("section");screen.className="module-install-screen module-install-overlay";
  screen.setAttribute("role","dialog");screen.setAttribute("aria-modal","true");screen.setAttribute("aria-label","MODULE INSTALL 改造机");
  screen.innerHTML=`<div class="module-install-viewport"><div class="module-install-canvas">
    <img class="module-install-background" src="assets/module-install-bg.webp" alt="" aria-hidden="true" width="864" height="1536">
    <header class="module-install-header"><button class="module-install-back" aria-label="装着画面を閉じて戻る">‹ 戻る</button><div><h2>MODULE INSTALL</h2><span class="module-player-heading"></span></div></header>
    <div class="module-install-storage"></div><div class="module-install-detail"></div>
    <section class="module-install-list-panel"><h3>未使用MODULE</h3><div class="module-install-list" aria-label="インストール候補"></div></section>
    <div class="module-install-targets" aria-label="装着先選択"></div>
  </div></div>`;
  el.inert=true;document.body.appendChild(screen);
  const canvas=screen.querySelector(".module-install-canvas"),detail=screen.querySelector(".module-install-detail"),list=screen.querySelector(".module-install-list"),targets=screen.querySelector(".module-install-targets"),storage=screen.querySelector(".module-install-storage");
  let currentId=targetId,selectedSlot=slotIndex,confirmation=null,closed=false;
  const target=()=>installTargets(c).find(i=>i.instanceId===currentId);
  const close=()=>{if(closed)return;closed=true;screen.remove();el.inert=previousInert;onDone();if(opener?.isConnected)opener.focus();};
  screen.querySelector(".module-install-back").onclick=close;
  function selectTarget(id){currentId=id;selectedSlot=null;paint();targets.querySelector(`[data-install-target="${id}"]`)?.focus();}
  function paint(){
    const item=target(),locked=!canModifyEquipment(c);
    screen.querySelector(".module-player-heading").textContent=`${c.name} · HP ${c.hp} / ${getEffectiveMaxHp(c)}`;
    if(item&&(!Number.isInteger(selectedSlot)||selectedSlot<0||selectedSlot>=item.moduleSlots))selectedSlot=null;
    targets.innerHTML=[c.weapon,...c.memories].map((i,n)=>`<div class="action-cell"><button class="action-icon" data-install-target="${esc(i.instanceId)}" aria-pressed="${i.instanceId===currentId}" aria-label="${esc(itemName(i))}、Module ${i.modules.length} / ${i.moduleSlots}"><img src="${n?memoryIcon(i):"assets/action-weapon.svg"}" alt=""></button><span class="action-name">${esc(itemName(i))}</span><span class="module-target-capacity">${i.modules.length} / ${i.moduleSlots}</span></div>`).join("");
    targets.querySelectorAll("[data-install-target]").forEach(b=>b.onclick=()=>selectTarget(b.dataset.installTarget));
    // Preserve installation into Storage Memories without adding a sixth equipped icon.
    const storedItems=[...c.inventory.weapons,...c.inventory.memories];
    storage.innerHTML=storedItems.length?`<select aria-label="所持装備への装着" id="moduleStorageTarget"><option value="">所持装備へ装着</option>${storedItems.map(m=>`<option value="${esc(m.instanceId)}" ${m.instanceId===currentId?"selected":""}>${esc(itemName(m))} · ${m.modules.length}/${m.moduleSlots}</option>`).join("")}</select>`:"";
    if(storage.firstElementChild)storage.firstElementChild.onchange=e=>{if(e.target.value)selectTarget(e.target.value);};
    if(!item){detail.innerHTML=`<div class="module-install-guide"><b>${esc(c.name)}</b><p>${esc(JOBS.find(j=>j.id===c.jobId)?.name||"職業未設定")} · HP ${c.hp} / ${getEffectiveMaxHp(c)}</p><p>${statsDescription(c)}</p><p>装着先を選択してください</p>${locked?"<small>戦闘中は確認のみ可能です。</small>":""}</div>`;}
    else{
      const memory=!!getMemDef(item),d=memory?getMemDef(item):null,old=selectedSlot!==null?moduleAtSlot(item,selectedSlot):null;
      detail.innerHTML=`<div class="module-target-heading"><div><b>${esc(itemName(item))}</b><small>${esc(item.rarity)} · ${memory?`${esc(d.category)} / ${d.execution}`:esc(item.weaponType)}</small></div>${memory&&c.memories.includes(item)?`<button id="changeMemory" ${locked?"disabled":""}>CHANGE</button>`:""}</div>
        <p class="module-target-spec">BASE POWER ${basePowerDescription(item)} · MAIN ${memory?d.main:weaponStatKey(item)}<br>HIT ${memory?d.hit:item.hit}% · ${memory?`CT ${item.currentCT}/${d.ct} · 破損 ${item.breakageRate.toFixed(2)}%${item.broken?" · BROKEN":""}`:`HIT COUNT ${item.hitCount||1}`}</p>
        <div class="module-install-slot-heading">MODULE ${item.modules.length} / ${item.moduleSlots}</div>
        <div class="module-install-slots" style="--slot-count:${item.moduleSlots}">${Array.from({length:item.moduleSlots},(_,slot)=>{const m=moduleAtSlot(item,slot),name=m?(getModuleDef(m)?.name||m.definitionId):"EMPTY";return `<button data-install-slot="${slot}" ${m?`data-overwrite-slot="${slot}"`:""} aria-pressed="${slot===selectedSlot}" aria-label="SLOT ${slot+1} ${esc(name)}、${m?"OVERWRITE":"INSTALL"}"><span>SLOT ${slot+1}</span><b>${esc(name)}</b></button>`;}).join("")}</div>
        <p class="module-selected-slot" role="status">${selectedSlot===null?"Slotを選択してください":`SLOT ${selectedSlot+1} · ${old?`${esc(getModuleDef(old)?.name||old.definitionId)}を上書き`:"EMPTY / INSTALL"}`}</p>`;
      const change=detail.querySelector("#changeMemory");if(change)change.onclick=()=>openMemoryChange(item);
      detail.querySelectorAll("[data-install-slot]").forEach(b=>b.onclick=()=>{selectedSlot=+b.dataset.installSlot;paint();detail.querySelector(`[data-install-slot="${selectedSlot}"]`)?.focus();});
    }
    const old=item&&selectedSlot!==null?moduleAtSlot(item,selectedSlot):null,ready=!!item&&selectedSlot!==null&&!locked;
    list.innerHTML=c.inventory.modules.map(m=>`<button class="module-workbench-choice" data-pick-module="${esc(m.instanceId)}" ${ready&&getModuleDef(m)?"":"disabled"}>${moduleSummary(m)}<span class="module-install-mode">${locked?"戦闘中は変更不可":!item?"装着先を選択":selectedSlot===null?"Slotを選択":old?"OVERWRITE ›":"INSTALL ›"}${moduleId===m.instanceId?" · 選択Module":""}</span></button>`).join("")||`<p class="module-install-empty">未使用モジュールなし。</p>`;
    list.querySelectorAll("[data-pick-module]").forEach(b=>b.onclick=()=>confirmModule(b.dataset.pickModule));
  }
  function openMemoryChange(item){
    if(!canModifyEquipment(c))return;
    const index=c.memories.indexOf(item);if(index<0)return;
    const dialog=equipmentDialog("memory-change-overlay","STORAGE MEMORY");
    dialog.body.innerHTML=c.inventory.memories.map(m=>`<button data-swap-memory="${esc(m.instanceId)}">${equipmentSummary(m)}<small>CT ${m.currentCT}/${getMemDef(m).ct} · 破損率 ${m.breakageRate.toFixed(2)}% · ${m.broken?"BROKEN":"ACTIVE"}</small></button>`).join("")||"所持メモリなし。";
    dialog.body.querySelectorAll("[data-swap-memory]").forEach(b=>b.onclick=()=>{
      if(canModifyEquipment(c)&&c.memories[index].instanceId===item.instanceId&&swapMemory(c,index,b.dataset.swapMemory)){
        currentId=c.memories[index].instanceId;selectedSlot=null;dialog.close();paint();detail.querySelector("#changeMemory")?.focus();
      }
    });dialog.overlay.querySelector("button:not(:disabled)").focus();
  }
  function confirmModule(id){
    const item=target(),slot=selectedSlot,module=c.inventory.modules.find(m=>m.instanceId===id);
    if(!item||slot===null||!module||!getModuleDef(module)||!canModifyEquipment(c))return;
    const old=moduleAtSlot(item,slot),oldId=old?.instanceId,focused=document.activeElement;
    confirmation=document.createElement("div");confirmation.className="module-workbench-confirm";
    confirmation.innerHTML=`<section role="dialog" aria-modal="true" aria-label="${old?"OVERWRITE":"INSTALL"}確認"><h3>${old?"OVERWRITE":"INSTALL"}</h3><div class="module-confirm-description">${moduleSummary(module)}<p>${esc(itemName(item))}の SLOT ${slot+1} に<br>インストールします。</p>${old?`<div class="overwritten-module">${moduleSummary(old)}</div><p class="negative">現在の「${esc(getModuleDef(old)?.name||old.definitionId)}」は上書きされ消失します。<br>※上書きされたModuleは消失します。<br>※元に戻すことはできません。</p>`:`<p class="negative">※一度インストールしたモジュールは取り外せません。</p>`}</div><div class="module-confirm-actions"><button id="cancelInstall">CANCEL</button><button id="${old?"confirmOverwrite":"confirmInstall"}">${old?"OVERWRITE":"INSTALL"}</button></div></section>`;
    canvas.inert=true;screen.appendChild(confirmation);
    const dismiss=()=>{confirmation?.remove();confirmation=null;canvas.inert=false;if(focused?.isConnected)focused.focus();};
    confirmation.querySelector("#cancelInstall").onclick=dismiss;
    confirmation.querySelector("#confirmInstall,#confirmOverwrite").onclick=()=>{
      const done=old?overwriteModule(c,id,item.instanceId,slot,oldId):installModule(c,id,item.instanceId,slot);
      if(done){dismiss();paint();detail.querySelector(`[data-install-slot="${slot}"]`)?.focus();}
      else{dismiss();paint();screen.querySelector(".module-install-back").focus();}
    };
    confirmation.dismiss=dismiss;confirmation.querySelector("#cancelInstall").focus();
  }
  screen.onkeydown=e=>{
    if(e.key==="Escape"){e.preventDefault();if(confirmation)confirmation.dismiss();else close();return;}
    if(e.key==="Tab"){
      const root=confirmation||canvas,nodes=[...root.querySelectorAll("button:not(:disabled),select")],first=nodes[0],last=nodes.at(-1);
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
    }
  };
  paint();screen.querySelector(".module-install-back").focus();
}
function equipmentList(c){
  return `<h3>EQUIPPED</h3><button class="inventory-item equipment-choice" data-equipment="${esc(c.weapon.instanceId)}"><small>WEAPON</small>${equipmentSummary(c.weapon)}<small>${esc(c.weapon.weaponType)} · BASE POWER ${basePowerDescription(c.weapon)} · MAIN ${weaponStatKey(c.weapon)} · HIT ${c.weapon.hit}% · ${c.weapon.hitCount||1} HIT</small></button>${c.memories.map((m,i)=>`<button class="inventory-item equipment-choice" data-equipment="${esc(m.instanceId)}"><small>MEMORY 0${i+1}</small>${equipmentSummary(m)}<small>CT ${m.currentCT}/${getMemDef(m).ct} · 破損率 ${m.breakageRate.toFixed(2)}% · ${m.broken?"BROKEN":"ACTIVE"}</small></button>`).join("")}`;
}
function renderPlaceholder(name){
  const labels={shop:"SHOP",archive:"ARCHIVE",lost:"LOST LOG",settings:"SETTINGS"};
  el.innerHTML=top()+`<section class="panel"><div class="kicker">${labels[name]||name}</div><h2>ALPHA // NOT IMPLEMENTED</h2><p class="muted small">仕様が確定してから実装します。</p></section><button class="btn ghost" data-nav="home">← HOME</button>`+footer();
  bindNav();
}

function showResult(title,text,after){
  const div=document.createElement("div");
  div.className="modal";
  div.innerHTML=`<div class="modal-card"><div class="kicker">NEHAN SYSTEM</div><h2>${esc(title)}</h2><p>${esc(text)}</p><button class="btn primary" id="modalOk">CONTINUE</button></div>`;
  document.body.appendChild(div);
  div.querySelector("#modalOk").onclick=()=>{div.remove();after&&after();};
}

function bindNav(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{state.screen=b.dataset.nav;save();render();});
}

state.screen="home";
render();
const pendingCharacter=state.slots.find(c=>c?.id===state.run?.ownerId);
if(pendingCharacter)scheduleCombatResolution(pendingCharacter);
const splash=document.querySelector("#splash");
let splashTimer, closed=false;
function closeSplash(){
  if(closed) return;
  closed=true;clearTimeout(splashTimer);
  splash.classList.add("leaving");
  el.inert=false;
  setTimeout(()=>splash.remove(),450);
}
el.inert=true;
splash.onclick=closeSplash;
splash.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();closeSplash();}};
splashTimer=setTimeout(closeSplash,2400);
// Follow the visual viewport while the software keyboard is open, without scrolling.
if(window.visualViewport){
  const fitViewport=()=>{el.style.height=`${window.visualViewport.height}px`;};
  window.visualViewport.addEventListener("resize",fitViewport);
  fitViewport();
}
})();
